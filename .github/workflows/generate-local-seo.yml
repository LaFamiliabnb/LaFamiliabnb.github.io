name: Generate local SEO pages

on:
  push:
    branches:
      - seo/zones-locales-20260728
    paths:
      - scripts/generate_local_seo_pages.py
      - scripts/local-seo-data.json
      - scripts/local-seo-template-part1.html
      - scripts/local-seo-template-part2.html
      - scripts/zones-index-part1.html
      - scripts/zones-index-part2.html
      - .github/workflows/generate-local-seo.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/zones-locales-20260728
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pages
        run: python scripts/generate_local_seo_pages.py

      - name: Validate generated output
        run: |
          test -f zones-intervention/index.html
          test -f conciergerie-airbnb-eguilles/index.html
          test -f conciergerie-airbnb-venelles/index.html
          test -f conciergerie-airbnb-le-tholonet/index.html
          test -f conciergerie-airbnb-puyricard/index.html
          test -f conciergerie-airbnb-luynes/index.html
          test -f conciergerie-airbnb-meyreuil/index.html
          test -f conciergerie-airbnb-bouc-bel-air/index.html
          test -f conciergerie-airbnb-cabries/index.html
          test -f conciergerie-airbnb-gardanne/index.html
          grep -q "Nos secteurs d’intervention" conciergerie-airbnb-aix-en-provence/index.html
          grep -q "zones-intervention" sitemap.xml

      - name: Commit generated pages
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conciergerie-airbnb-aix-en-provence/index.html sitemap.xml zones-intervention/index.html
          git add conciergerie-airbnb-eguilles/index.html conciergerie-airbnb-venelles/index.html
          git add conciergerie-airbnb-le-tholonet/index.html conciergerie-airbnb-puyricard/index.html
          git add conciergerie-airbnb-luynes/index.html conciergerie-airbnb-meyreuil/index.html
          git add conciergerie-airbnb-bouc-bel-air/index.html conciergerie-airbnb-cabries/index.html
          git add conciergerie-airbnb-gardanne/index.html
          git commit -m "Generate local SEO pages"
          git push origin HEAD:seo/zones-locales-20260728
