name: One-off add owner portal link

on:
  push:
    paths:
      - ".github/workflows/.trigger-owner-portal-link.txt"

permissions:
  contents: write

jobs:
  update-owner-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add owner portal link to footer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "proprietaires.lafamiliabnb.fr/login.html" not in html:
              marker = '          <li><a href="/blog/">Blog propriétaires</a></li>'
              link = '          <li><a href="https://proprietaires.lafamiliabnb.fr/login.html" target="_blank" rel="noopener nofollow">Espace propriétaire</a></li>'
              if marker not in html:
                  raise SystemExit("Footer marker not found")
              html = html.replace(marker, marker + "\n" + link, 1)
              path.write_text(html, encoding="utf-8")

          Path(".github/workflows/one-off-add-owner-portal-link.yml").unlink(missing_ok=True)
          Path(".github/workflows/.trigger-owner-portal-link.txt").unlink(missing_ok=True)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-off-add-owner-portal-link.yml .github/workflows/.trigger-owner-portal-link.txt
          git commit -m "Add owner portal link to footer" || exit 0
          git push origin HEAD:main
