name: Apply key figures

on:
  push:
    branches:
      - feat/chiffres-cles-20260728

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter le bloc de chiffres clés
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          old = '''    <section class="trust-strip" aria-label="Chiffres et preuves de confiance">
              <div class="trust-item"><strong>7j/7</strong><span>assistance voyageurs</span></div>
              <div class="trust-item"><strong>Airbnb + Booking</strong><span>diffusion multi-plateformes</span></div>
              <div class="trust-item"><strong>Aix-en-Provence</strong><span>gestion locale terrain</span></div>
              <div class="trust-item"><strong>20%</strong><span>commission de gestion</span><small>Une tarification claire, expliquée avant toute mise en location.</small></div>
            </section>'''.replace("              ", "      ")

          new = '''    <section class="key-figures" aria-labelledby="key-figures-title">
              <div class="key-figures-heading">
                <span class="eyebrow"><i class="fas fa-chart-line" aria-hidden="true"></i> Des résultats vérifiables</span>
                <h2 id="key-figures-title">La Familia en chiffres</h2>
                <p>Des repères concrets pour mesurer l’expérience et l’activité de notre conciergerie dans le Pays d’Aix.</p>
              </div>

              <div class="trust-strip" aria-label="Chiffres clés de La Familia">
                <div class="trust-item"><strong>50</strong><span>logements gérés</span><small>à Aix-en-Provence et dans le Pays d’Aix</small></div>
                <div class="trust-item"><strong>1 000+</strong><span>séjours réalisés</span><small>sur la période suivie</small></div>
                <div class="trust-item"><strong>263 000 €</strong><span>de loyers bruts générés</span><small>hors ménage et taxe de séjour</small></div>
                <div class="trust-item"><strong>7j/7</strong><span>assistance voyageurs</span><small>pendant les séjours</small></div>
              </div>

              <p class="key-figures-note">
                Données issues de notre logiciel de gestion, arrêtées au 28 juillet 2026. Les séjours comptabilisés ont une date de départ comprise entre le 26 avril et le 28 juillet 2026. Le montant des loyers bruts est arrondi et exclut les frais de ménage et la taxe de séjour.
              </p>
            </section>'''.replace("              ", "      ")

          if old not in html:
              raise SystemExit("Bloc trust-strip d’origine introuvable")
          index_path.write_text(html.replace(old, new, 1), encoding="utf-8")

          css_path = Path("public-site.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* KEY-FIGURES-20260728 */"
          if marker not in css:
              css += '''

          /* KEY-FIGURES-20260728 */
          .key-figures {
            max-width: 1180px;
            margin: 0 auto;
            padding: 18px 6% 58px;
          }
          .key-figures-heading {
            max-width: 820px;
            margin: 0 auto 30px;
            text-align: center;
          }
          .key-figures-heading h2 {
            margin-top: 18px;
            margin-bottom: 14px;
          }
          .key-figures-heading p {
            font-size: 1.08rem;
            margin: 0;
          }
          .key-figures .trust-strip {
            max-width: none;
            margin: 0;
            padding: 0;
          }
          .key-figures .trust-item {
            display: flex;
            min-height: 190px;
            flex-direction: column;
            justify-content: center;
            padding: 28px 22px;
          }
          .key-figures .trust-item strong {
            font-family: "PlayfairDisplay", Georgia, serif;
            font-size: clamp(2.25rem, 4vw, 3.25rem);
            line-height: 1;
            letter-spacing: -.035em;
          }
          .key-figures .trust-item span {
            display: block;
            font-weight: 900;
            line-height: 1.35;
          }
          .key-figures-note {
            max-width: 980px;
            margin: 20px auto 0;
            color: var(--muted);
            font-size: .82rem;
            line-height: 1.55;
            text-align: center;
          }
          @media (max-width: 980px) {
            .key-figures { padding-top: 8px; }
            .key-figures .trust-item { min-height: 0; }
          }
          '''.replace("          ", "")
              css_path.write_text(css, encoding="utf-8")
          PY

      - name: Committer les fichiers générés
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public-site.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: afficher les chiffres clés vérifiés"
          git push
