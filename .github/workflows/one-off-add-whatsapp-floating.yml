name: One-off add WhatsApp floating link

on:
  push:
    branches:
      - codex/homepage-provence-video-offres
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homepage-provence-video-offres
      - name: Insert WhatsApp floating link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'class="whatsapp-floating"' not in text:
              marker = '  <footer>\n'
              link = '''  <a class="whatsapp-floating" href="https://wa.me/33651094966?text=Bonjour%20La%20Familia%2C%20je%20souhaite%20vous%20contacter%20au%20sujet%20de%20la%20gestion%20de%20mon%20logement." target="_blank" rel="noopener" aria-label="Contacter La Familia sur WhatsApp">
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
    <span>WhatsApp</span>
  </a>

'''
              if marker not in text:
                  raise SystemExit('footer marker not found')
              text = text.replace(marker, link + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add floating WhatsApp link"
          git push origin codex/homepage-provence-video-offres
