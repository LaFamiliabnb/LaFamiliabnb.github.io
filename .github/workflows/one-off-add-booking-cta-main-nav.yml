name: One-off add booking CTA main nav

on: push

permissions:
  contents: write

jobs:
  add-booking-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add booking CTA next to estimate CTA
        run: |
          python3 <<'PY'
          from pathlib import Path

          old_li = '<li><a href="/estimation-revenus-airbnb-aix-en-provence/" class="nav-cta">Estimer mes revenus</a></li>'
          new_li = '<li><a href="/estimation-revenus-airbnb-aix-en-provence/" class="nav-cta">Estimer mes revenus</a></li>\n          <li><a href="https://booking.lafamiliabnb.fr/reservation.html" class="nav-cta nav-cta-booking" target="_blank" rel="noopener">Réserver votre séjour <i class="fas fa-external-link-alt" aria-hidden="true"></i></a></li>'

          old_css = '''    .nav-cta {
      background: var(--dark);
      color: var(--cream) !important;
      padding: 14px 19px;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
    }'''
          new_css = '''    .nav-cta {
      background: var(--dark);
      color: var(--cream) !important;
      padding: 14px 19px;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
    }

    .nav-cta-booking {
      background: transparent;
      color: var(--dark) !important;
      border: 2px solid var(--dark);
      box-shadow: none;
    }

    .nav-cta-booking:hover {
      background: var(--dark);
      color: var(--cream) !important;
    }

    .nav-cta-booking i { font-size: .78rem; margin-left: 4px; }'''

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts or path.parts[:2] == ('.github', 'workflows'):
                  continue
              html = path.read_text(encoding='utf-8')
              original = html

              if old_li in html and 'booking.lafamiliabnb.fr/reservation.html" class="nav-cta nav-cta-booking' not in html:
                  html = html.replace(old_li, new_li)

              if 'nav-cta-booking' in html and '.nav-cta-booking {' not in html and old_css in html:
                  html = html.replace(old_css, new_css, 1)

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for item in changed:
              print('-', item)

          Path('.github/workflows/one-off-add-booking-cta-main-nav.yml').unlink(missing_ok=True)
          PY

      - name: Commit booking CTA update
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add booking CTA to main navigation"
            git push
          else
            echo "No changes needed."
          fi
