name: Discover cleaning photo upload

on:
  push:
    branches:
      - feature/compress-cleaning-report-photos
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate cleaning report upload code
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Repository web files ==="
            find www -maxdepth 4 -type f 2>/dev/null | sort
            echo "=== Photo and upload candidates ==="
            grep -RInE \
              -e 'type="file"' \
              -e "type='file'" \
              -e 'capture=' \
              -e 'FileReader' \
              -e 'createImageBitmap' \
              -e 'canvas' \
              -e 'toBlob' \
              -e 'toDataURL' \
              -e 'FormData' \
              -e 'storage/v1/object' \
              -e '\.upload[[:space:]]*\(' \
              -e 'photo' \
              -e 'image/' \
              . \
              --include='*.js' \
              --include='*.html' \
              --exclude-dir=.git \
              --exclude='discover-cleaning-upload.yml' \
              | head -1500 || true
          } > cleaning-upload-discovery.txt
      - name: Upload discovery result
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-upload-discovery
          path: cleaning-upload-discovery.txt
          retention-days: 1
