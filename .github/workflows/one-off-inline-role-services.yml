name: Inline role services

on:
  push:
    branches:
      - codex/homepage-provence-video-offres
    paths:
      - '.github/workflows/.trigger-inline-role-services.txt'
      - '.github/workflows/one-off-inline-role-services.yml'

permissions:
  contents: write

jobs:
  inline-role-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homepage-provence-video-offres
      - name: Move service bubbles into role panel
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old_button = '            <div class="actions"><a href="#services" class="button secondary">Voir nos services</a></div>'
          services_block = '''            <div class="role-service-bubbles" aria-label="Nos services La Familia">
              <span class="role-service-title">Nos services</span>
              <a href="/conciergerie-airbnb-aix-en-provence/">Conciergerie Airbnb Aix-en-Provence <span aria-hidden="true">↗</span></a>
              <a href="/gestion-location-saisonniere-aix-en-provence/">Gestion Airbnb et location courte durée <span aria-hidden="true">↗</span></a>
              <a href="/tarifs-conciergerie-airbnb-aix-en-provence/">Tarifs conciergerie Airbnb <span aria-hidden="true">↗</span></a>
              <a href="/estimation-revenus-airbnb-aix-en-provence/">Estimation revenus Airbnb <span aria-hidden="true">↗</span></a>
              <a href="/menage-airbnb-aix-en-provence/">Ménage Airbnb <span aria-hidden="true">↗</span></a>
              <a href="https://booking.lafamiliabnb.fr/reservation.html" target="_blank" rel="noopener">Réserver votre séjour <span aria-hidden="true">↗</span></a>
            </div>'''
          if old_button not in text:
            raise SystemExit('Bouton Voir nos services introuvable')
          text = text.replace(old_button, services_block, 1)

          marker = '<h2>Explorer nos services</h2>'
          h2 = text.find(marker)
          if h2 != -1:
            start = text.rfind('    <section', 0, h2)
            end = text.find('\n    </section>', h2)
            if start != -1 and end != -1:
              end += len('\n    </section>')
              text = text[:start] + text[end:]

          index.write_text(text, encoding='utf-8')

          css = Path('public-site.css')
          css_text = css.read_text(encoding='utf-8')
          for line in [
            '@import url("/public-site-services-inline.css");\n',
            '@import url("/public-site-services-in-role.css");\n',
            '@import url("/public-site-services-inside-role.css");\n',
          ]:
            css_text = css_text.replace(line, '')
          if '@import url("/public-site-role-services.css");' not in css_text:
            css_text = css_text.rstrip() + '\n@import url("/public-site-role-services.css");\n'
          css.write_text(css_text, encoding='utf-8')

          Path('public-site-role-services.css').write_text('''/* Bulles de services intégrées directement dans la colonne “Notre rôle”. */
.role-service-bubbles {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: clamp(24px, 3vw, 34px);
}

.role-service-title {
  flex: 0 0 100%;
  display: block;
  margin-bottom: 2px;
  color: #8f4d2f;
  font-family: "PlayfairDisplay", Georgia, serif;
  font-size: clamp(1.15rem, 1.7vw, 1.45rem);
  font-weight: 800;
  letter-spacing: -.02em;
}

.role-service-bubbles a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 10px 15px;
  border: 1px solid rgba(184, 107, 61, .24);
  border-radius: 999px;
  background: rgba(255, 250, 244, .94);
  color: #26231f;
  font-size: .86rem;
  font-weight: 850;
  line-height: 1.16;
  text-decoration: none;
  box-shadow: 0 10px 26px rgba(54, 38, 24, .055);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.role-service-bubbles a span {
  color: #b86b3d;
  font-size: .86rem;
  line-height: 1;
}

.role-service-bubbles a:hover {
  transform: translateY(-2px);
  border-color: rgba(184, 107, 61, .44);
  box-shadow: 0 15px 38px rgba(54, 38, 24, .09);
}

@media (max-width: 760px) {
  .role-service-bubbles {
    justify-content: center;
  }

  .role-service-title {
    text-align: center;
  }

  .role-service-bubbles a {
    width: 100%;
  }
}
''', encoding='utf-8')

          for p in [
            Path('.github/workflows/one-off-inline-role-services.yml'),
            Path('.github/workflows/.trigger-inline-role-services.txt'),
          ]:
            if p.exists():
              p.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html public-site.css public-site-role-services.css .github/workflows/one-off-inline-role-services.yml .github/workflows/.trigger-inline-role-services.txt
          git commit -m "Inline service bubbles in role panel" || exit 0
          git push
