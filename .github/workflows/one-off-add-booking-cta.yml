name: One-off add booking CTA

on: push

permissions:
  contents: write

jobs:
  add-booking-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add booking CTA to main homepage
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          css_marker = '''    .nav-cta {
      background: var(--dark);
      color: var(--cream) !important;
      padding: 14px 19px;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
    }
'''
          css_add = '''    .nav-cta {
      background: var(--dark);
      color: var(--cream) !important;
      padding: 14px 19px;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
    }

    .nav-booking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--dark);
      border-radius: 999px;
      padding: 12px 18px;
      background: transparent;
      color: var(--dark) !important;
      box-shadow: none;
    }

    .nav-booking:hover {
      background: var(--dark);
      color: var(--cream) !important;
    }

    .button.booking {
      background: transparent;
      color: var(--dark);
      border-color: var(--dark);
      box-shadow: none;
    }

    .button.booking:hover {
      background: var(--dark);
      color: var(--cream);
      border-color: var(--dark);
    }
'''
          if '.nav-booking' not in html:
              if css_marker not in html:
                  raise SystemExit('CSS marker not found')
              html = html.replace(css_marker, css_add, 1)

          nav_old = '          <li><a href="/estimation-revenus-airbnb-aix-en-provence/" class="nav-cta">Estimer mes revenus</a></li>\n'
          nav_new = '          <li><a href="/estimation-revenus-airbnb-aix-en-provence/" class="nav-cta">Estimer mes revenus</a></li>\n          <li><a href="https://booking.lafamiliabnb.fr/reservation.html" class="nav-booking" target="_blank" rel="noopener">Réserver votre séjour <i class="fas fa-external-link-alt" aria-hidden="true"></i></a></li>\n'
          if 'Réserver votre séjour' not in html:
              if nav_old not in html:
                  raise SystemExit('Header CTA marker not found')
              html = html.replace(nav_old, nav_new, 1)

          hero_old = '          <a href="/estimation-revenus-airbnb-aix-en-provence/" class="button">Estimer mes revenus <i class="fas fa-arrow-right"></i></a>\n          <a href="/conciergerie-airbnb-aix-en-provence/" class="button secondary">Découvrir nos services</a>\n'
          hero_new = '          <a href="/estimation-revenus-airbnb-aix-en-provence/" class="button">Estimer mes revenus <i class="fas fa-arrow-right"></i></a>\n          <a href="https://booking.lafamiliabnb.fr/reservation.html" class="button booking" target="_blank" rel="noopener">Réserver votre séjour <i class="fas fa-external-link-alt" aria-hidden="true"></i></a>\n          <a href="/conciergerie-airbnb-aix-en-provence/" class="button secondary">Découvrir nos services</a>\n'
          if 'class="button booking"' not in html:
              if hero_old not in html:
                  raise SystemExit('Hero CTA marker not found')
              html = html.replace(hero_old, hero_new, 1)

          bottom_old = '          <a href="/estimation-revenus-airbnb-aix-en-provence/" class="button">Estimer mes revenus</a>\n'
          bottom_new = '          <div class="actions" style="margin-top:0; justify-content:flex-end;">\n            <a href="/estimation-revenus-airbnb-aix-en-provence/" class="button">Estimer mes revenus</a>\n            <a href="https://booking.lafamiliabnb.fr/reservation.html" class="button booking" target="_blank" rel="noopener">Réserver votre séjour <i class="fas fa-external-link-alt" aria-hidden="true"></i></a>\n          </div>\n'
          if bottom_old in html and 'justify-content:flex-end' not in html:
              html = html.replace(bottom_old, bottom_new, 1)

          if html != original:
              path.write_text(html, encoding='utf-8')

          Path('.github/workflows/one-off-add-booking-cta.yml').unlink(missing_ok=True)
          PY

      - name: Commit booking CTA
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add booking stay CTA to homepage"
            git push
          else
            echo "No changes needed."
          fi
