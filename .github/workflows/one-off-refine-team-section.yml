name: One-off refine team section

on:
  push:
    branches:
      - codex/homepage-provence-video-offres

permissions:
  contents: write

jobs:
  refine-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homepage-provence-video-offres
      - name: Refine team section
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''    <section class="section alt" id="equipe">
      <div class="container">
        <h2>Une équipe locale, humaine et disponible</h2>
        <p class="section-intro">
          Les propriétaires ne confient pas seulement un logement : ils confient un actif, un lieu de vie et parfois une résidence secondaire.
          La relation de confiance est donc au cœur de notre manière de travailler.
        </p>

        <div class="team">
          <div class="team-photo"><img src="/img/profil-Aurore.png" alt="Portrait d'Aurore, La Familia à Aix-en-Provence" /></div>
          <div>
            <h3>Aurore, votre contact La Familia</h3>
            <p class="quote">“Notre objectif : permettre aux propriétaires de louer plus sereinement, tout en offrant aux voyageurs une expérience soignée.”</p>
            <p>Aurore accompagne les propriétaires à Aix-en-Provence avec une approche locale, réactive et transparente. Chaque logement est étudié selon son potentiel, son emplacement, son niveau de confort et les objectifs du propriétaire.</p>
            <p>La Familia privilégie un suivi humain : échanges clairs, coordination terrain, attention portée aux détails et amélioration continue de l’expérience voyageurs.</p>
          </div>
        </div>
      </div>
    </section>'''

          new = '''    <section class="section alt team-premium-section" id="equipe">
      <div class="container">
        <span class="home-kicker">Votre interlocutrice</span>
        <h2>Une gestion humaine, portée par une vraie présence locale</h2>
        <p class="section-intro">
          Vous ne confiez pas seulement des clés : vous confiez un actif immobilier. Chez La Familia, chaque logement est suivi avec attention, depuis la mise en location jusqu’aux retours voyageurs.
        </p>

        <div class="team-premium-card">
          <div class="team-premium-photo">
            <img src="/img/profil-Aurore.png" alt="Portrait d'Aurore Pageard, votre contact La Familia à Aix-en-Provence" />
            <span class="team-premium-badge"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> Basée à Aix-en-Provence</span>
          </div>

          <div class="team-premium-content">
            <span class="role">Contact propriétaire</span>
            <h3>Aurore Pageard</h3>
            <p class="team-premium-quote">“Chaque logement mérite un suivi attentif, pas une gestion automatique.”</p>
            <p class="team-premium-copy">
              Aurore accompagne les propriétaires avec une approche locale, directe et transparente. L’objectif : vous permettre de déléguer sereinement l’exploitation du logement, tout en gardant une vision claire sur la qualité, les revenus et les points d’amélioration.
            </p>

            <div class="team-proof-grid" aria-label="Engagements de suivi propriétaire">
              <div class="team-proof"><i class="fas fa-map-marked-alt" aria-hidden="true"></i><strong>Présence locale</strong><span>Une équipe proche des logements gérés et disponible sur le terrain.</span></div>
              <div class="team-proof"><i class="fas fa-comments" aria-hidden="true"></i><strong>Suivi clair</strong><span>Des échanges directs, lisibles et réguliers avec chaque propriétaire.</span></div>
              <div class="team-proof"><i class="fas fa-star" aria-hidden="true"></i><strong>Exigence terrain</strong><span>Ménage, linge, arrivées, imprévus et expérience voyageurs coordonnés.</span></div>
            </div>

            <div class="team-premium-actions">
              <a href="/estimation-revenus-airbnb-aix-en-provence/" class="button">Échanger avec Aurore <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
              <a class="google-link" href="https://g.page/r/CY1FbkZ1_yF_EBM" target="_blank" rel="noopener">Voir notre fiche Google</a>
            </div>
          </div>
        </div>
      </div>
    </section>'''

          if old not in text and 'team-premium-section' not in text:
              raise SystemExit('Section équipe originale introuvable')
          if old in text:
              text = text.replace(old, new, 1)

          css = r'''

    .team-premium-section .container {
      max-width: 1180px;
    }

    .team-premium-section .home-kicker,
    .team-premium-section h2,
    .team-premium-section .section-intro {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .team-premium-section .section-intro {
      max-width: 820px;
      font-size: 1.08rem;
      line-height: 1.85;
    }

    .team-premium-card {
      display: grid;
      grid-template-columns: minmax(260px, .88fr) minmax(0, 1.12fr);
      gap: clamp(34px, 5vw, 72px);
      align-items: center;
      max-width: 1120px;
      margin: 52px auto 0;
      padding: clamp(28px, 5vw, 56px);
      border: 1px solid rgba(184, 107, 61, .14);
      border-radius: 32px;
      background: radial-gradient(circle at 10% 15%, rgba(184, 107, 61, .08), transparent 34%), rgba(255, 255, 255, .90);
      box-shadow: 0 34px 95px rgba(54, 38, 24, .12);
      text-align: left;
    }

    .team-premium-photo {
      position: relative;
    }

    .team-premium-photo img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(54, 38, 24, .18);
    }

    .team-premium-badge {
      position: absolute;
      left: 20px;
      bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 250, 244, .92);
      color: #8f4d2f;
      font-weight: 900;
      font-size: .82rem;
      box-shadow: 0 18px 40px rgba(54, 38, 24, .16);
      backdrop-filter: blur(10px);
    }

    .team-premium-content .role {
      display: inline-flex;
      margin-bottom: 14px;
      color: #b86b3d;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .72rem;
      font-weight: 900;
    }

    .team-premium-content h3 {
      font-size: clamp(1.65rem, 3vw, 2.45rem);
      line-height: 1.08;
      margin-bottom: 20px;
    }

    .team-premium-quote {
      position: relative;
      margin: 0 0 26px;
      padding: 0 0 0 22px;
      border-left: 3px solid #c46f3e;
      color: #9d5a34;
      font-family: "PlayfairDisplay", Georgia, serif;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      font-style: italic;
      line-height: 1.25;
    }

    .team-premium-copy {
      color: #332f2a;
      line-height: 1.78;
      margin-bottom: 26px;
    }

    .team-proof-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 28px 0 30px;
    }

    .team-proof {
      padding: 18px 16px;
      border: 1px solid rgba(184, 107, 61, .16);
      border-radius: 18px;
      background: #fffaf4;
    }

    .team-proof i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 12px;
      border-radius: 999px;
      background: #f1dfcf;
      color: #b86b3d;
      font-size: .9rem;
    }

    .team-proof strong {
      display: block;
      margin-bottom: 6px;
      color: #26231f;
      font-weight: 900;
    }

    .team-proof span {
      display: block;
      color: #665a50;
      font-size: .9rem;
      line-height: 1.45;
    }

    .team-premium-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .team-premium-actions .google-link {
      color: #8f4d2f;
      font-weight: 900;
      text-decoration: none;
      border-bottom: 1px solid rgba(143, 77, 47, .35);
      padding-bottom: 3px;
    }
'''
          if '.team-premium-card' not in text:
              marker = '    @media (max-width: 1100px) {'
              text = text.replace(marker, css + '\n' + marker, 1)

          mobile_css = '''
      .team-premium-card {
        grid-template-columns: 1fr;
        max-width: 680px;
        text-align: center;
      }

      .team-premium-photo {
        max-width: 420px;
        margin: 0 auto;
      }

      .team-premium-quote {
        padding-left: 0;
        border-left: 0;
      }

      .team-proof-grid {
        grid-template-columns: 1fr;
      }

      .team-premium-actions {
        justify-content: center;
      }
'''
          mobile_marker = '      .hero-review-mobile {'
          if '.team-premium-card {\n        grid-template-columns: 1fr;' not in text:
              text = text.replace(mobile_marker, mobile_css + '\n' + mobile_marker, 1)

          small_marker = '      .homepage #services .why-card { min-height: 0; text-align: center; }'
          small_extra = '''      .homepage #services .why-card { min-height: 0; text-align: center; }
      .team-premium-card { padding: 24px; border-radius: 26px; }
      .team-premium-badge { position: static; margin: 16px auto 0; width: fit-content; }'''
          if '.team-premium-badge { position: static;' not in text:
              text = text.replace(small_marker, small_extra, 1)

          path.write_text(text, encoding='utf-8')
          for p in [Path('.github/workflows/one-off-refine-team-section.yml'), Path('.github/workflows/.trigger-refine-team-section.txt')]:
              if p.exists():
                  p.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-off-refine-team-section.yml .github/workflows/.trigger-refine-team-section.txt
          git commit -m "Refine homepage team section" || echo "No changes to commit"
          git push
