name: Temporary patch key figures

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align key figures section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_css = '''  <style>
    .key-figures {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 6% 58px;
    }

    .key-figures-heading {
      max-width: 820px;
      margin: 0 auto 30px;
      text-align: center;
    }

    .key-figures-heading h2 {
      margin-top: 18px;
      margin-bottom: 14px;
    }

    .key-figures-heading p {
      margin: 0;
      font-size: 1.08rem;
    }

    .key-figures .trust-strip {
      max-width: none;
      margin: 0;
      padding: 0;
    }

    .key-figures .trust-item {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px;
    }

    .key-figures .trust-item strong {
      font-family: "PlayfairDisplay", Georgia, serif;
      font-size: clamp(2.25rem, 4vw, 3.25rem);
      line-height: 1;
      letter-spacing: -.035em;
    }

    .key-figures .trust-item span {
      display: block;
      font-weight: 900;
      line-height: 1.35;
    }

    .key-figures-note {
      max-width: 980px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 980px) {
      .key-figures { padding-top: 8px; }
      .key-figures .trust-item { min-height: 0; }
    }
  </style>'''

          new_css = '''  <style>
    .key-figures {
      width: 100%;
      padding: 24px 6% 58px;
    }

    .key-figures-heading {
      max-width: 1180px;
      margin: 0 auto 30px;
      text-align: center;
    }

    .key-figures-heading h2 {
      margin-top: 0;
      margin-bottom: 14px;
    }

    .key-figures-heading p {
      margin: 0;
      font-size: 1.08rem;
    }

    .key-figures .trust-strip {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0;
    }

    .key-figures .trust-item {
      display: flex;
      min-height: 190px;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
    }

    .key-figures .trust-item strong {
      font-family: "PlayfairDisplay", Georgia, serif;
      font-size: clamp(2.25rem, 4vw, 3.25rem);
      line-height: 1;
      letter-spacing: -.035em;
      white-space: nowrap;
    }

    .key-figures .trust-item span {
      display: block;
      font-weight: 900;
      line-height: 1.35;
    }

    .key-figures .revenue-card strong {
      font-size: clamp(1.65rem, 2.1vw, 2.35rem);
    }

    .key-figures-note {
      max-width: 1180px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 980px) {
      .key-figures { padding-top: 8px; }
      .key-figures .trust-item { min-height: 0; }
    }
  </style>'''

          replacements = [
              (old_css, new_css, "styles du bloc chiffres"),
              ('        <span class="eyebrow"><i class="fas fa-chart-line" aria-hidden="true"></i> Des résultats vérifiables</span>\n', '', "bulle de réassurance"),
              ('      <div class="trust-strip" aria-label="Chiffres clés de La Familia">', '      <div class="trust-strip key-figures-grid" aria-label="Chiffres clés de La Familia">', "classe de grille"),
              ('        <div class="trust-item"><strong>1 337 890 €</strong><span>de revenus générés</span><small>pour nos propriétaires en 2025</small></div>', '        <div class="trust-item revenue-card"><strong>1&nbsp;337&nbsp;890&nbsp;€</strong><span>de revenus générés</span><small>pour nos propriétaires en 2025</small></div>', "montant des revenus"),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f"Motif introuvable : {label}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aligne et ajuste le bloc des chiffres clés"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
