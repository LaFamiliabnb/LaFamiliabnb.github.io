name: Temporary patch key figures

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chiffres-alignement-20260728
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply visual correction
        run: python3 scripts/patch-key-figures.py

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à valider"
          else
            git commit -m "Aligne et ajuste le bloc des chiffres clés"
            git push origin HEAD:fix/chiffres-alignement-20260728
          fi
