name: One-off refine why section

on:
  push:
    branches:
      - codex/homepage-provence-video-offres

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homepage-provence-video-offres

      - name: Refine why section
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_section = '''    <section class="section alt compact-bottom why-premium-section" id="services">
      <div class="container">
        <span class="home-kicker">Notre différence</span>
        <h2>Pourquoi les propriétaires nous confient leur logement ?</h2>
        <p class="section-intro">
          Une conciergerie locale, située au 6 rue Gibelin à Aix-en-Provence, qui combine présence terrain, gestion complète et suivi clair des performances.
        </p>

        <div class="why-premium-layout" aria-label="Raisons de choisir La Familia">
          <article class="card why-card why-card-featured why-card-local">
            <span class="why-card-kicker">Présence locale réelle</span>
            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
            <h3>Une vraie présence à Aix-en-Provence</h3>
            <p>Situés au <strong>6 rue Gibelin, 13100 Aix-en-Provence</strong>, nous sommes proches des logements que nous gérons. Cela nous permet de coordonner les ménages, les arrivées, les imprévus et la qualité terrain avec réactivité.</p>
            <a class="google-link" href="https://g.page/r/CY1FbkZ1_yF_EBM" target="_blank" rel="noopener">Voir notre fiche Google <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
            <div class="why-card-proof"><span>★★★★★</span><strong>5/5 · 42 avis Google</strong></div>
          </article>

          <article class="card why-card why-card-management">
            <i class="fas fa-concierge-bell" aria-hidden="true"></i>
            <h3>Une gestion complète, sans charge mentale</h3>
            <p>Annonce, messages voyageurs, arrivées, départs, ménage, linge, réassort, prix et suivi propriétaire : vous déléguez l’exploitation quotidienne, nous gardons le cap opérationnel.</p>
          </article>

          <article class="card why-card why-card-revenue">
            <i class="fas fa-chart-line" aria-hidden="true"></i>
            <h3>Des revenus pilotés, pas subis</h3>
            <p>Nous ajustons les prix selon la saison, la demande, les événements locaux, le taux d’occupation et le potentiel réel du logement, avec une stratégie adaptée à chaque bien.</p>
          </article>

          <article class="card why-card why-card-experience">
            <i class="fas fa-star" aria-hidden="true"></i>
            <h3>Une expérience voyageur qui protège vos avis</h3>
            <p>Un logement propre, bien préparé, des consignes claires et une assistance réactive : chaque détail compte pour obtenir de meilleurs avis et fidéliser la performance du bien.</p>
          </article>

          <a class="why-google-band" href="https://g.page/r/CY1FbkZ1_yF_EBM" target="_blank" rel="noopener" aria-label="Voir les avis Google La Familia">
            <span class="google-stars">★★★★★</span>
            <strong>5/5 · 42 avis Google</strong>
            <em>Estimation gratuite et sans engagement · réponse sous 24 h</em>
          </a>
        </div>
      </div>
    </section>'''

          pattern = re.compile(r'    <section class="section alt compact-bottom" id="services">.*?    </section>\n\n    <section class="section">\n      <div class="container">\n        <h2>Pourquoi louer en courte durée à Aix-en-Provence \?</h2>', re.S)
          repl = new_section + '\n\n    <section class="section">\n      <div class="container">\n        <h2>Pourquoi louer en courte durée à Aix-en-Provence ?</h2>'
          text, count = pattern.subn(repl, text, count=1)
          if count != 1:
            raise SystemExit(f'Section replacement failed: {count}')

          css = '''
    .why-premium-section .section-intro {
      max-width: 840px !important;
    }

    .why-premium-layout {
      display: grid !important;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr) !important;
      grid-template-areas:
        "local management revenue"
        "local experience proof" !important;
      gap: 24px !important;
      max-width: 1180px !important;
      margin: 48px auto 0 !important;
      text-align: left !important;
    }

    .why-premium-layout .why-card {
      position: relative !important;
      min-height: 100% !important;
      padding: clamp(28px, 3.2vw, 44px) !important;
      border-radius: 26px !important;
      background: rgba(255, 255, 255, .88) !important;
      border: 1px solid rgba(184, 107, 61, .12) !important;
      box-shadow: 0 28px 70px rgba(54, 38, 24, .10) !important;
    }

    .why-premium-layout .why-card i {
      width: 42px !important;
      height: 42px !important;
      margin-bottom: 22px !important;
      background: #f2ddca !important;
      color: #b86b3d !important;
    }

    .why-premium-layout .why-card h3 {
      max-width: 520px !important;
      font-size: clamp(1.45rem, 2vw, 2.15rem) !important;
      line-height: 1.08 !important;
      margin-bottom: 18px !important;
    }

    .why-premium-layout .why-card p {
      color: #332f2a !important;
      font-size: 1rem !important;
      line-height: 1.72 !important;
    }

    .why-card-local {
      grid-area: local !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      background: linear-gradient(145deg, #fffaf4 0%, #f3e1cf 100%) !important;
      border-color: rgba(184, 107, 61, .32) !important;
      box-shadow: 0 34px 90px rgba(54, 38, 24, .16) !important;
    }

    .why-card-management { grid-area: management !important; }
    .why-card-revenue { grid-area: revenue !important; }
    .why-card-experience { grid-area: experience !important; }

    .why-card-kicker {
      display: inline-flex !important;
      width: fit-content !important;
      margin-bottom: 24px !important;
      color: #9d5a34 !important;
      text-transform: uppercase !important;
      letter-spacing: .16em !important;
      font-size: .72rem !important;
      font-weight: 900 !important;
    }

    .why-card-proof {
      display: inline-flex !important;
      align-items: center !important;
      gap: 10px !important;
      margin-top: 26px !important;
      padding-top: 18px !important;
      border-top: 1px solid rgba(184, 107, 61, .22) !important;
      color: #26231f !important;
      font-weight: 900 !important;
    }

    .why-card-proof span,
    .why-google-band .google-stars {
      color: #f6b92f !important;
      letter-spacing: .05em !important;
      white-space: nowrap !important;
    }

    .why-premium-layout .google-link {
      margin-top: 24px !important;
      border-bottom: 0 !important;
      color: #8f4d2f !important;
      font-weight: 900 !important;
    }

    .why-premium-layout .google-link i {
      width: 38px !important;
      height: 38px !important;
      margin: 0 !important;
      background: #f2ddca !important;
    }

    .why-google-band {
      grid-area: proof !important;
      display: flex !important;
      min-height: 100% !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      justify-content: center !important;
      gap: 8px !important;
      padding: clamp(24px, 3vw, 38px) !important;
      border: 1px solid rgba(184, 107, 61, .20) !important;
      border-radius: 26px !important;
      background: #26231f !important;
      color: #fffaf4 !important;
      text-decoration: none !important;
      box-shadow: 0 28px 70px rgba(54, 38, 24, .16) !important;
    }

    .why-google-band strong {
      color: #fffaf4 !important;
      font-size: 1.25rem !important;
    }

    .why-google-band em {
      color: rgba(255, 250, 244, .72) !important;
      font-style: normal !important;
      line-height: 1.55 !important;
    }

    @media (max-width: 980px) {
      .why-premium-layout {
        grid-template-columns: 1fr !important;
        grid-template-areas:
          "local"
          "management"
          "revenue"
          "experience"
          "proof" !important;
        max-width: 680px !important;
      }

      .why-premium-layout .why-card,
      .why-google-band {
        text-align: center !important;
        align-items: center !important;
      }

      .why-card-kicker,
      .why-card-proof {
        margin-left: auto !important;
        margin-right: auto !important;
      }
    }
'''
          if 'why-premium-layout' not in text:
            text = text.replace('    @media (max-width: 1100px) {', css + '\n    @media (max-width: 1100px) {', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/one-off-refine-why-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-off-refine-why-section.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine homepage why choose section"
            git push origin HEAD:codex/homepage-provence-video-offres
          fi
