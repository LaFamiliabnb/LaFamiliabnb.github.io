name: Patch PR4 key figures

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-key-figures:
    if: github.head_ref == 'feat/chiffres-cles-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chiffres-cles-20260728
          fetch-depth: 0

      - name: Mettre à jour les chiffres clés
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          replacements = {
              '<div class="trust-item"><strong>50</strong><span>logements gérés</span><small>à Aix-en-Provence et dans le Pays d’Aix</small></div>': '<div class="trust-item"><strong>50+</strong><span>logements gérés</span><small>à Aix-en-Provence et dans le Pays d’Aix</small></div>',
              '<div class="trust-item"><strong>1 000+</strong><span>séjours réalisés</span><small>sur la période suivie</small></div>': '<div class="trust-item"><strong>5 000+</strong><span>séjours réalisés</span><small>depuis le lancement de La Familia</small></div>',
              '<div class="trust-item"><strong>263 000 €</strong><span>de loyers bruts générés</span><small>hors ménage et taxe de séjour</small></div>': '<div class="trust-item"><strong>87 %</strong><span>de taux d’occupation moyen</span><small>sur l’année 2025</small></div>',
              '<div class="trust-item"><strong>7j/7</strong><span>assistance voyageurs</span><small>pendant les séjours</small></div>': '<div class="trust-item"><strong>1 337 890 €</strong><span>de revenus générés</span><small>pour nos propriétaires en 2025</small></div>',
              'Données issues de notre logiciel de gestion, arrêtées au 28 juillet 2026. Les séjours comptabilisés ont une date de départ comprise entre le 26 avril et le 28 juillet 2026. Le montant des loyers bruts est arrondi et exclut les frais de ménage et la taxe de séjour.': 'Chiffres communiqués par La Familia. Le taux d’occupation correspond à la moyenne annuelle 2025 des logements gérés et disponibles à la commercialisation. Les revenus générés correspondent aux revenus locatifs enregistrés en 2025.'
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Texte introuvable : {old[:80]}')
              html = html.replace(old, new, 1)

          path.write_text(html, encoding='utf-8')
          Path('.trigger-key-figures').unlink(missing_ok=True)
          PY

      - name: Committer la correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .trigger-key-figures
          git diff --cached --quiet && exit 0
          git commit -m "fix: mettre à jour les chiffres clés 2025"
          git push origin HEAD:feat/chiffres-cles-20260728
